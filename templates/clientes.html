{% extends 'layout.html' %}

{% block title %}Customers{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Customers</h1>
    <a href="/clientes/novo" class="btn-primary" style="width: auto; display: inline-flex;">+ Add Customer</a>
</div>

<div style="margin-bottom: 1.5rem;">
    <input type="text" id="searchInput" placeholder="Search by name, phone or email..." style="width: 100%; padding: 0.875rem 1rem; border-radius: 12px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-primary);">
</div>

<div class="table-container">
    <table id="clientesTable">
        <thead>
            <tr>
                <th style="width: 70px;">ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Address</th>
                <th>Documents</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="7" style="text-align:center;">Loading...</td></tr>
        </tbody>
    </table>
</div>

<div class="pagination-controls" style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; flex-wrap: wrap; gap: 10px;">
    <button id="btnPrevPage" class="btn-primary" style="padding: 10px 15px; width: auto; min-width: 100px;">&laquo; Previous</button>
    <span id="paginationInfo" style="color: var(--text-secondary); font-size: 0.9rem;"></span>
    <button id="btnNextPage" class="btn-primary" style="padding: 10px 15px; width: auto; min-width: 100px;">Next &raquo;</button>
</div>
<!-- Edit Modal -->
<div id="editClientModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;">
    <div class="glass-card" style="width:100%; max-width:500px; padding:2rem; position:relative;">
        <button id="closeClientModal" style="position:absolute; top:15px; right:20px; background:transparent; border:none; color:white; font-size:1.5rem; cursor:pointer;" aria-label="Close">&times;</button>
        <h2>Edit Customer</h2>
        <form id="editClientForm" class="modern-form" style="margin-top:1.5rem;">
            <input type="hidden" id="edit_id">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="edit_nome" required>
            </div>
            <div class="form-row">
                <div class="form-group half">
                    <label>Phone</label>
                    <input type="tel" id="edit_telefone" required>
                </div>
                <div class="form-group half">
                    <label>Email</label>
                    <input type="email" id="edit_email" required>
                </div>
            </div>
            <div class="form-group">
                <label>Full Address</label>
                <input type="text" id="edit_endereco" required>
            </div>
            <div class="form-row">
                <div class="form-group half">
                    <label>New Driving Licence (Front)</label>
                    <input type="file" id="edit_habilitacao" accept="image/*,.pdf">
                </div>
                <div class="form-group half">
                    <label>New Driving Licence (Back)</label>
                    <input type="file" id="edit_habilitacao_verso" accept="image/*,.pdf">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group half">
                    <label>New CBT Certificate <span style="font-size:0.75rem; color:var(--text-secondary);">(Optional)</span></label>
                    <input type="file" id="edit_cbt" accept="image/*,.pdf">
                </div>
                <div class="form-group half">
                    <label>New Proof of Address</label>
                    <input type="file" id="edit_comprovante_endereco" accept="image/*,.pdf">
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/clientes.js"></script>
{% endblock %}
