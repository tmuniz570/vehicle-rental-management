{% extends 'layout.html' %}

{% block title %}Customers{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Customers</h1>
    <a href="/clientes/novo" class="btn-primary" style="width: auto; display: inline-flex;">+ Add Customer</a>
</div>

<div style="margin-bottom: 1.5rem;">
    <input type="text" id="searchInput" placeholder="Search by name, phone, email or #ID..." style="width: 100%; padding: 0.875rem 1rem; border-radius: 12px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-primary);">
</div>

<div class="table-container">
    <table id="clientesTable">
        <thead>
            <tr>
                <th data-sort-field="id" style="width: 70px;">ID</th>
                <th data-sort-field="nome">Name</th>
                <th data-sort-field="telefone">Phone</th>
                <th data-sort-field="email">Email</th>
                <th data-sort-field="endereco">Address</th>
                <th>Documents</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="7" style="text-align:center;">Loading...</td></tr>
        </tbody>
    </table>
</div>

<div class="pagination-controls" style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; flex-wrap: wrap; gap: 10px;">
    <button id="btnPrevPage" class="btn-primary" style="padding: 10px 15px; width: auto; min-width: 100px;">&laquo; Previous</button>
    <span id="paginationInfo" style="color: var(--text-secondary); font-size: 0.9rem;"></span>
    <button id="btnNextPage" class="btn-primary" style="padding: 10px 15px; width: auto; min-width: 100px;">Next &raquo;</button>
</div>
<!-- Edit Modal -->
<div id="editClientModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalEditClientTitle">
    <div class="modal-card" style="max-width: 520px;">
        <div class="modal-header">
            <h3 id="modalEditClientTitle">Edit Customer</h3>
            <button type="button" id="closeClientModal" class="modal-close" title="Close" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body" style="padding: 1.25rem 1.5rem 1.5rem;">
            <form id="editClientForm" class="modern-form">
                <input type="hidden" id="edit_id">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="edit_nome" required>
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label>Phone</label>
                        <input type="tel" id="edit_telefone" required>
                    </div>
                    <div class="form-group half">
                        <label>Email <span style="font-size:0.75rem; color:var(--text-secondary); font-weight:normal;">(Optional)</span></label>
                        <input type="email" id="edit_email" placeholder="e.g. john@example.co.uk (optional)">
                    </div>
                </div>
                <div class="form-group">
                    <label>Full Address</label>
                    <input type="text" id="edit_endereco" required>
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label>New Driving Licence (Front)</label>
                        <input type="file" id="edit_habilitacao" accept="image/*,.pdf">
                    </div>
                    <div class="form-group half">
                        <label>New Driving Licence (Back)</label>
                        <input type="file" id="edit_habilitacao_verso" accept="image/*,.pdf">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label>New CBT Certificate <span style="font-size:0.75rem; color:var(--text-secondary);">(Optional)</span></label>
                        <input type="file" id="edit_cbt" accept="image/*,.pdf">
                    </div>
                    <div class="form-group half">
                        <label>New Proof of Address</label>
                        <input type="file" id="edit_comprovante_endereco" accept="image/*,.pdf">
                    </div>
                </div>
                <div class="form-actions" style="margin-top:1.5rem; padding-bottom:0.25rem;">
                    <button type="submit" class="btn-primary" id="btnSalvarCliente" style="width:100%; padding:0.875rem 1.25rem; font-size:0.95rem; font-weight:600;">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/clientes.js?v=3"></script>
{% endblock %}
