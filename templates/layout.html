<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b0d13">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" href="/static/images/logo.png">
    <title>{% block title %}Dashboard{% endblock %} | FF Motors Birmingham</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css?v=3">
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="app-layout">
        <!-- Mobile Header (Hidden on Desktop) -->
        <header class="mobile-header">
            <div class="mobile-brand">
                <img src="/static/images/logo.png" alt="FF Motors" style="height: 38px; width: auto; object-fit: contain;">
            </div>
            <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Toggle navigation menu">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <img src="/static/images/logo.png" alt="FF Motors" style="width: 100%; max-width: 180px; height: auto; object-fit: contain;">
            </div>
            
            <nav class="sidebar-nav">
                <a href="/" class="{% if request.path == '/' %}active{% endif %}">
                    Dashboard
                </a>
                <a href="/motos" class="{% if 'moto' in request.path %}active{% endif %}">
                    Fleet
                </a>
                <a href="/clientes" class="{% if 'cliente' in request.path %}active{% endif %}">
                    Customers
                </a>
                <a href="/contratos" class="{% if 'contrato' in request.path %}active{% endif %}">
                    Contracts
                </a>
                <a href="/vistorias" class="{% if 'vistoria' in request.path %}active{% endif %}">
                    Inspections
                </a>
                <a href="/financeiro" class="{% if 'financeiro' in request.path %}active{% endif %}">
                    Financial
                </a>
                <a href="/relatorios" class="{% if 'relatorio' in request.path %}active{% endif %}">
                    Reports
                </a>
            </nav>
        </aside>
        <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

        <!-- Main Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    
    {% block scripts %}{% endblock %}
    <script>
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarBackdrop = document.getElementById('sidebarBackdrop');
        
        function toggleSidebar() {
            if (sidebar) {
                const isOpen = sidebar.classList.toggle('open');
                if (sidebarBackdrop) {
                    sidebarBackdrop.classList.toggle('active', isOpen);
                }
            }
        }

        if (mobileMenuBtn) {
            mobileMenuBtn.addEventListener('click', toggleSidebar);
        }
        if (sidebarBackdrop) {
            sidebarBackdrop.addEventListener('click', toggleSidebar);
        }
    </script>
</body>
</html>
