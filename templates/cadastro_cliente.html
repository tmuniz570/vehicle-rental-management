{% extends 'layout.html' %}

{% block title %}Register Customer{% endblock %}

{% block content %}
<div class="page-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
    <div>
        <h1>New Customer</h1>
        <p style="color: var(--text-secondary); margin-top: 0.25rem;">Fill in details and upload documentation to register a customer.</p>
    </div>
    <a href="/clientes" class="btn-secondary btn-back" data-back="true">&larr; Back to Customers</a>
</div>

<div class="glass-card" style="max-width: 650px; margin: 0 auto;">
    
    <form id="clientForm" class="modern-form">
        <div class="form-group">
            <label for="nome">Full Name</label>
            <input type="text" id="nome" name="nome" placeholder="e.g. John Smith" required>
        </div>
        
        <div class="form-row">
            <div class="form-group half">
                <label for="telefone">Phone / WhatsApp</label>
                <input type="tel" id="telefone" name="telefone" placeholder="+44 7911 123456" required>
            </div>
            
            <div class="form-group half">
                <label for="email">Email Address <span style="font-size:0.75rem; color:var(--text-secondary); font-weight:normal;">(Optional)</span></label>
                <input type="email" id="email" name="email" placeholder="e.g. john.smith@example.co.uk (optional)">
            </div>
        </div>

        <div class="form-group">
            <label for="endereco">Full Address & Postcode</label>
            <input type="text" id="endereco" name="endereco" placeholder="e.g. 123 High St, Birmingham B4 7ET, UK" required>
        </div>

        <div class="form-row">
            <div class="form-group half">
                <label for="habilitacao">Driving Licence - Front (Photo/PDF)</label>
                <input type="file" id="habilitacao" name="habilitacao" accept="image/*,.pdf" style="padding-top: 10px;">
            </div>
            <div class="form-group half">
                <label for="habilitacao_verso">Driving Licence - Back (Photo/PDF)</label>
                <input type="file" id="habilitacao_verso" name="habilitacao_verso" accept="image/*,.pdf" style="padding-top: 10px;">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group half">
                <label for="cbt">CBT Certificate (Photo/PDF) <span style="font-size:0.75rem; color:var(--text-secondary); font-weight:normal;">(Optional / If applicable)</span></label>
                <input type="file" id="cbt" name="cbt" accept="image/*,.pdf" style="padding-top: 10px;">
            </div>
            <div class="form-group half">
                <label for="comprovante_endereco">Proof of Address (Photo/PDF)</label>
                <input type="file" id="comprovante_endereco" name="comprovante_endereco" accept="image/*,.pdf" style="padding-top: 10px;">
            </div>
        </div>

        <div id="feedbackMessage" class="feedback-message hidden"></div>

        <div class="form-actions">
            <button type="submit" class="btn-primary" id="submitBtn">
                <span class="btn-text">Register Customer</span>
                <div class="loader hidden"></div>
            </button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/cadastro_cliente.js"></script>
{% endblock %}
