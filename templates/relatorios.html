{% extends 'layout.html' %}

{% block title %}Reports{% endblock %}

{% block head %}
<!-- Chart.js via CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}

{% block content %}
<div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
    <h1>Reports & Analytics</h1>
    <a href="/relatorios/vencidos" target="_blank" class="btn-primary" style="background: #dc3545; color: white; text-decoration: none; padding: 0.75rem 1.5rem; display: inline-block; border-radius: 8px;">Generate Overdue Report</a>
</div>

<div class="dashboard-grid">
    <!-- Revenue Chart -->
    <div class="glass-card" style="padding: 1.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 350px;">
        <h3 style="margin-bottom: 1rem; color: var(--text-primary);">Revenue (Rent & Fines)</h3>
        <div style="position: relative; height: 250px; width: 100%;">
            <canvas id="faturamentoChart"></canvas>
        </div>
    </div>

    <!-- Fleet Chart -->
    <div class="glass-card" style="padding: 1.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 350px;">
        <h3 style="margin-bottom: 1rem; color: var(--text-primary);">Fleet Status</h3>
        <div style="position: relative; height: 250px; width: 100%;">
            <canvas id="frotaChart"></canvas>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="/static/js/relatorios.js"></script>
{% endblock %}
