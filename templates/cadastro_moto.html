{% extends 'layout.html' %}

{% block title %}Add Motorbike{% endblock %}

{% block content %}
<div class="page-header">
    <h1>New Motorbike</h1>
</div>

<div class="glass-card">
    <div class="card-header">
        <p>Enter details to register a vehicle into the fleet.</p>
    </div>
    
    <form id="motoForm" class="modern-form">
        <div class="form-row">
            <div class="form-group half">
                <label for="modelo">Model</label>
                <input type="text" id="modelo" name="modelo" placeholder="e.g. Honda PCX 125" required>
            </div>
            
            <div class="form-group half">
                <label for="cor">Colour</label>
                <input type="text" id="cor" name="cor" placeholder="e.g. White" required>
            </div>
        </div>
        
        <div class="form-group">
            <label for="placa">Registration Plate (Reg No.)</label>
            <input type="text" id="placa" name="placa" placeholder="BP21 XYZ" required autocapitalize="characters" style="text-transform: uppercase;">
        </div>

        <div id="feedbackMessage" class="feedback-message hidden"></div>

        <div class="form-actions">
            <button type="submit" class="btn-primary" id="submitBtn">
                <span class="btn-text">Register Motorbike</span>
                <div class="loader hidden"></div>
            </button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/cadastro_moto.js"></script>
{% endblock %}
