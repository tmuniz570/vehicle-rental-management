{% extends 'layout.html' %}

{% block title %}Contracts{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Contracts</h1>
    <a href="/contratos/novo" class="btn-primary" style="width: auto; display: inline-flex;">+ New Contract</a>
</div>

<div style="margin-bottom: 1.5rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
    <input type="text" id="searchInput" placeholder="Search by ID, reg plate, customer, type, status..." style="flex: 1; min-width: 200px; padding: 0.875rem 1rem; border-radius: 12px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-primary);">
    
    <div style="display: flex; align-items: center; gap: 0.5rem; background: var(--card-bg); padding: 0.35rem 0.75rem; border-radius: 12px; border: 1px solid var(--border-color);">
        <span style="font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap;">Type:</span>
        <select id="filterTipo" style="padding: 0.5rem 0.75rem; border-radius: 8px; border: none; background: transparent; color: var(--text-primary); font-weight: 500; cursor: pointer; outline: none;">
            <option value="" selected style="background: #1e293b; color: white;">All Types</option>
            <option value="Rent" style="background: #1e293b; color: white;">🛵 Rental Only</option>
            <option value="Sale" style="background: #1e293b; color: white;">💰 Sales (All)</option>
            <option value="Sale_Full" style="background: #1e293b; color: white;">Sale: Full</option>
            <option value="Sale_Installment" style="background: #1e293b; color: white;">Sale: Installment</option>
        </select>
    </div>

    <div style="display: flex; align-items: center; gap: 0.5rem; background: var(--card-bg); padding: 0.35rem 0.75rem; border-radius: 12px; border: 1px solid var(--border-color);">
        <span style="font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap;">Status:</span>
        <select id="filterStatus" style="padding: 0.5rem 0.75rem; border-radius: 8px; border: none; background: transparent; color: var(--text-primary); font-weight: 500; cursor: pointer; outline: none;">
            <option value="open" selected style="background: #1e293b; color: white;">Open / In Progress (Non-finalized)</option>
            <option value="all" style="background: #1e293b; color: white;">All Statuses</option>
            <option value="Active" style="background: #1e293b; color: white;">Active</option>
            <option value="Deposit_Hold" style="background: #1e293b; color: white;">Deposit Holds Only</option>
            <option value="Completed" style="background: #1e293b; color: white;">Completed Only</option>
            <option value="Cancelled" style="background: #1e293b; color: white;">Cancelled Only</option>
        </select>
    </div>
</div>

<div class="table-container">
    <table id="contratosTable">
        <thead>
            <tr>
                <th data-sort-field="id" style="width: 70px;">ID</th>
                <th data-sort-field="tipo">Type</th>
                <th data-sort-field="cliente">Customer</th>
                <th data-sort-field="placa">Reg Plate</th>
                <th data-sort-field="data_retirada">Date</th>
                <th data-sort-field="dia_pagamento_semanal">Due / Terms</th>
                <th data-sort-field="valor_aluguel_semanal">Amount</th>
                <th data-sort-field="status">Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="9" style="text-align:center;">Loading...</td></tr>
        </tbody>
    </table>
</div>

<div class="pagination-controls" style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; flex-wrap: wrap; gap: 10px;">
    <button id="btnPrevPage" class="btn-primary" style="padding: 10px 15px; width: auto; min-width: 100px;">&laquo; Previous</button>
    <span id="paginationInfo" style="color: var(--text-secondary); font-size: 0.9rem;"></span>
    <button id="btnNextPage" class="btn-primary" style="padding: 10px 15px; width: auto; min-width: 100px;">Next &raquo;</button>
</div>{% endblock %}

{% block scripts %}
<script src="/static/js/contratos.js?v=5"></script>
{% endblock %}
